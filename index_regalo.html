<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feliz 18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root {
  /* Paleta: papel crema envejecido + negro tinta + grises de foto antigua */
  --bg: #e9e3d3;
  --card: #f4efe2;
  --accent: #1d1c1a;
  --accent-text: #f4efe2;
  --text: #2a2926;
  --muted: #8b877d;
  --paper: #f8f4e8;
  --paper-text: #2a2926;

  --font-title: 'Permanent Marker', 'Rock Salt', 'Segoe Print', 'Bradley Hand', 'Marker Felt', cursive;
  --font-body: Georgia, 'Times New Roman', serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: var(--font-body); }
body { background: var(--bg); color: var(--text); overflow-x: hidden; }

.wrap { max-width: 520px; margin: auto; padding: 24px 16px 60px; min-height: 100vh;
  display: flex; flex-direction: column; justify-content: center; text-align: center; }
.top { font-family: var(--font-title); font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 6px; }
h1, h2 { font-family: var(--font-title); color: var(--accent); font-weight: 400; line-height: 1.1; margin: 6px 0 16px; letter-spacing: .5px; }
h1 { font-size: clamp(34px, 9vw, 52px); }
h2 { font-size: 28px; }
.script { font-style: italic; margin: 8px 0 18px; color: var(--muted); }

.card { background: var(--card); border: 2px solid var(--accent); border-radius: 4px; padding: 22px 18px; }

button { border: 2px solid var(--accent); border-radius: 4px; padding: 14px 24px; background: var(--accent); color: var(--accent-text);
  font-family: var(--font-title); font-size: 17px; letter-spacing: .5px; cursor: pointer; margin: 10px 4px 4px; }
button:active { transform: translateY(2px); }
button.secondary { background: var(--card); color: var(--accent); }

.paper { background: var(--paper); color: var(--paper-text); border: 2px solid var(--accent); border-radius: 4px;
  padding: 24px 20px; text-align: left; font-size: 17px; line-height: 1.55; }
.paper p { margin: 0 0 14px; }
.paper .signature { text-align: right; font-family: var(--font-title); margin-top: 20px; }
.paper .quote { font-style: italic; font-weight: 700; text-align: center; border-top: 2px dashed currentColor;
  border-bottom: 2px dashed currentColor; padding: 10px 4px; margin: 16px 0; }

/* ---------- Diseño musical ---------- */
/* Disco de vinilo giratorio */
.vinyl { width: 190px; height: 190px; margin: 14px auto 22px; border-radius: 50%; position: relative;
  background:
    radial-gradient(circle, transparent 0 24%, rgba(255,255,255,.06) 24.5% 25.5%, transparent 26% 100%),
    repeating-radial-gradient(circle, #1d1c1a 0 3px, #2c2b28 3px 4px);
  border: 2px solid var(--accent); box-shadow: 0 6px 0 rgba(29,28,26,.25);
  animation: spin 7s linear infinite; }
.vinyl::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 30deg, transparent 0 20%, rgba(255,255,255,.10) 25%, transparent 30% 70%, rgba(255,255,255,.10) 75%, transparent 80%); }
.vinyl .label { position: absolute; inset: 62px; border-radius: 50%; background: var(--paper); color: var(--accent);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 30px; border: 2px solid var(--accent); }
.vinyl .label::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); top: -22px; opacity: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Ecualizador */
.eq { display: flex; align-items: flex-end; justify-content: center; gap: 5px; height: 34px; margin: 10px auto 6px; }
.eq span { width: 6px; background: var(--accent); height: 100%; transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
.eq span:nth-child(2) { animation-delay: .15s; } .eq span:nth-child(3) { animation-delay: .3s; }
.eq span:nth-child(4) { animation-delay: .45s; } .eq span:nth-child(5) { animation-delay: .6s; }
.eq span:nth-child(6) { animation-delay: .25s; } .eq span:nth-child(7) { animation-delay: .5s; }
@keyframes eq { 0%,100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }

/* Tracklist */
.side { font-family: var(--font-title); color: var(--muted); letter-spacing: 2px; margin: 4px 0 -4px; }
.gifts-grid { display: flex; flex-direction: column; gap: 0; margin: 16px 0; border-top: 2px solid var(--accent); }
.gift-card { display: flex; align-items: center; gap: 14px; padding: 16px 6px; border-bottom: 2px solid var(--accent);
  text-align: left; cursor: pointer; position: relative; }
.gift-card .num { font-family: var(--font-title); font-size: 26px; color: var(--muted); min-width: 40px; }
.gift-card h3 { margin: 0 0 2px; color: var(--accent); font-family: var(--font-title); font-weight: 400; font-size: 19px; }
.gift-card p { margin: 0; font-size: 14px; color: var(--muted); }
.gift-card.played .num { color: var(--accent); }
.badge { margin-left: auto; font-family: var(--font-title); font-size: 11px; border: 2px solid var(--accent);
  padding: 3px 8px; border-radius: 3px; }
.count { font-family: var(--font-title); margin: 12px 0 6px; color: var(--muted); }

/* Reproductor con miniatura de YouTube */
.player { border: 2px solid var(--accent); background: var(--card); margin-bottom: 16px; text-align: left; }
.player .thumb { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; cursor: pointer;
  background-size: cover; background-position: center; background-color: var(--accent);
  filter: grayscale(.7) sepia(.35) contrast(1.05); transition: filter .3s; }
.player .thumb:hover { filter: grayscale(.2) sepia(.15); }
.player .playbtn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 70px; height: 70px; border-radius: 50%; background: var(--paper); color: var(--accent);
  border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 28px; padding-left: 5px; box-shadow: 0 4px 0 rgba(29,28,26,.35); }
.player .thumb:active .playbtn { transform: translate(-50%, -48%); }
.player-info { padding: 12px 14px; border-top: 2px solid var(--accent); }
.player-info .song { font-family: var(--font-title); font-size: 18px; color: var(--accent); }
.player-info .artist { font-size: 14px; color: var(--muted); margin-top: 2px; }
.player-info .hint { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }
.video { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* Cuenta regresiva (pantalla bloqueada) */
.countdown { font-family: var(--font-title); font-size: clamp(24px, 7vw, 32px); color: var(--accent); letter-spacing: 1px; }

.fade { animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================
   CONFIGURACIÓN: editá SOLO este bloque para cada réplica
   Podés usar en cualquier texto: {nombre} {de} {fecha} {edad}
   Dejá "" en lo que quieras omitir.
   ===================================================== */
const CONFIG = {
  // --- Datos personales (completá vos) ---
  nombre: "Aylen",            // de la cumpleañera
  de: "Juan Enmanuel",             // quien regala
  fecha: "24 de noviembre de 2026",              // texto para mostrar, ej: 23 de julio de 2026
  edad: "18",
  frasePersonal: "La vida es como un disco: da vueltas, y solo queda seguir los surcos hasta el final...",           // frase propia (opcional, aparece en el final)

  // --- Apertura programada ---
  fechaApertura: "2026-11-24",   // día en que se abre (AAAA-MM-DD). Debe coincidir con "fecha"
  soloEseDia: true,              // true: abre SOLO ese día · false: abre ese día y todos los siguientes
  modoPrueba: false,              // true: ignora el candado (para probar vos). Dejalo en false al enviarlo

  lockTitle: "Todavía<br>no es el día",
  lockSubtitle: "Este disco se abre el {fecha}",
  lockCountdownLabel: "Faltan",
  lockPastTitle: "Este disco<br>ya sonó",
  lockPastSubtitle: "Solo se podía abrir el {fecha}",

  tabTitle: "Feliz {edad}, {nombre}",
  etiqueta: "Edición especial · {edad} años",

  // --- 1. Bienvenida ---
  welcomeTitle: "Feliz {edad},<br>{nombre}",
  welcomeSubtitle: "Un disco hecho solo para vos · {fecha}",
  welcomeButton: "▶ REPRODUCIR",

  // --- 2. Carta ---
  letterTitle: "Lado A: la carta",
  letterGreeting: "Querida {nombre},",
  letterParagraphs: [
    "Hoy empieza un capítulo nuevo: cumplís {edad} años, y quería regalarte este detalle por tu cumple y desearte lo mejor.",
    "Dicen que los {edad} son un punto de partida: más decisiones, más libertad y muchas puertas por abrir. Todo lo que fuiste hasta acá ya es parte de tu historia, y lo que viene todavía está por escribirse.",
    "La vida se parece a un disco: tiene temas rápidos, otros más tranquilos, silencios, estribillos que no se te van de la cabeza y canciones que querés repetir mil veces. Ojalá la tuya tenga siempre buen ritmo y buena compañía.",
    "Gracias por los momentos de charla y las anécdotas que no quedarán en el olvido, y por esos momentos inolvidables que pasamos. Ni la distancia podrá quitarnos eso.",
    "Esto es solo el comienzo: más abajo te dejé la lista de temas de tu disco. Escuchalos con calma. 🎶"
  ],
  letterSignature: "Con cariño, {de}",
  letterButton: "VER LA LISTA DE TEMAS",

  // --- 3. Regalos (tracklist) ---
  giftsTitle: "Tu tracklist",
  giftsSubtitle: "Tocá cada pista para escucharla",
  giftsCounter: "pistas escuchadas",
  seenLabel: "ESCUCHADA",
  backButton: "VOLVER A LA LISTA",
  homeButton: "VOLVER AL INICIO",
  finalButtonLabel: "IR AL BONUS TRACK",

  /* type: "text"  -> párrafos (y quote opcional)
     type: "video" -> video de YouTube (youtubeId) + párrafos
     Si youtubeId queda vacío, no se muestra el video. */
  gifts: [
    {
      type: "text",
      cardTitle: "Intro",
      cardDesc: "Unas frases para arrancar",
      title: "Intro",
      paragraphs: [
        "<b>Que nunca te falten motivos para sonreír.</b>",
        "Que cada paso de tus {edad} te encuentre disfrutando el camino.",
        "Y que siempre recuerdes lo especial que sos."
      ],
      quote: ""
    },
    {
      type: "text",
      cardTitle: "Para {nombre}",
      cardDesc: "Un mensaje directo al corazón",
      title: "Para {nombre}",
      paragraphs: [
        "La música siempre nos trae recuerdos que no queremos soltar, porque son parte de nosotros y nos hacen sentir bien. No se trata de volver a ese momento, sino de sentirlo de nuevo. Y ahora que cumplís {edad}, es hora de elegir tus propios recuerdos para el futuro.",
        "Preparé esto con mucho cariño para que tengas un recuerdo lindo de tus {edad}.",
        "<b>No dejes en el olvido lo que te hace sentir diferente.</b>"
      ],
      quote: ""
    },
    {
      type: "video",
      cardTitle: "Tu canción",
      cardDesc: "Un tema elegido para vos",
      title: "Tu canción",
      youtubeId: "MnxU4ZxUh2k",   // ID del video (lo que va después de youtu.be/ o ?v=)
      videoTitle: "Del olvido",
      videoArtist: "Guasones",     // opcional, dejá "" para ocultarlo
      paragraphs: [
        "Quise dejarte un tema en lugar de solo palabras.",
        "Subile el volumen y que suene fuerte."
      ],
      quote: "Que pase el tiempo que tenga que pasar: hay días que no se olvidan, y este es uno de ellos."
    }
  ],

  // --- 4. Final ---
  finalTitle: "Bonus track",
  finalLines: [
    "Llegaste al final del disco, pero la música sigue.",
    "<b>¡Feliz cumpleaños número {edad}, {nombre}!</b>",
    "Después te espero con tu regalo sorpresa. 🎁",
    "Nos vemos en el próximo tema."
  ]
};

/* =====================================================
   LÓGICA (no hace falta tocar)
   ===================================================== */
const fill = s => String(s)
  .replaceAll("{nombre}", CONFIG.nombre).replaceAll("{de}", CONFIG.de)
  .replaceAll("{fecha}", CONFIG.fecha).replaceAll("{edad}", CONFIG.edad);

document.title = fill(CONFIG.tabTitle);
const seen = new Set();
let lockTimer = null;
const topLabel = () => `<div class="top">${CONFIG.etiqueta}</div>`;
const paras = arr => arr.filter(Boolean).map(t => `<p>${t}</p>`).join("");
const vinyl = () => `<div class="vinyl"><div class="label">${CONFIG.edad}</div></div>`;
const eq = () => `<div class="eq"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>`;

function render(html) {
  clearInterval(lockTimer);
  document.getElementById("app").innerHTML = '<main class="wrap fade">' + fill(html) + '</main>';
}

/* ----- Apertura programada ----- */
function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Devuelve "before" (todavía no), "open" (se puede abrir) o "after" (ya pasó el día)
function lockState() {
  if (CONFIG.modoPrueba) return "open";
  const hoy = todayKey(), dia = CONFIG.fechaApertura;
  if (hoy < dia) return "before";
  if (hoy === dia) return "open";
  return CONFIG.soloEseDia ? "after" : "open";
}

function lockScreen() {
  if (lockState() === "after") {
    render(`
      ${topLabel()}
      ${vinyl()}
      <h1>${CONFIG.lockPastTitle}</h1>
      <div class="script">${CONFIG.lockPastSubtitle}</div>
    `);
    return;
  }
  const [y, m, d] = CONFIG.fechaApertura.split("-").map(Number);
  const target = new Date(y, m - 1, d, 0, 0, 0).getTime();
  render(`
    ${topLabel()}
    ${vinyl()}
    <h1>${CONFIG.lockTitle}</h1>
    <div class="script">${CONFIG.lockSubtitle}</div>
    <div class="card">
      <div class="top">${CONFIG.lockCountdownLabel}</div>
      <div class="countdown" id="cd"></div>
    </div>
  `);
  const tick = () => {
    const ms = target - Date.now();
    if (ms <= 0) { clearInterval(lockTimer); start(); return; }
    const s = Math.floor(ms / 1000);
    const dd = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600),
          mm = Math.floor(s % 3600 / 60), ss = s % 60;
    const el = document.getElementById("cd");
    if (el) el.textContent = `${dd}d ${String(hh).padStart(2, "0")}h ${String(mm).padStart(2, "0")}m ${String(ss).padStart(2, "0")}s`;
  };
  tick();
  lockTimer = setInterval(tick, 1000);
}

function start() {
  if (lockState() === "open") welcome();
  else lockScreen();
}

/* ----- Pantallas ----- */
function welcome() {
  render(`
    ${topLabel()}
    ${vinyl()}
    <h1>${CONFIG.welcomeTitle}</h1>
    <div class="script">${CONFIG.welcomeSubtitle}</div>
    <button onclick="letter()">${CONFIG.welcomeButton}</button>
  `);
}

function letter() {
  render(`
    ${topLabel()}
    <h2>${CONFIG.letterTitle}</h2>
    <div class="paper">
      <p><b>${CONFIG.letterGreeting}</b></p>
      ${paras(CONFIG.letterParagraphs)}
      <p class="signature">${CONFIG.letterSignature}</p>
    </div>
    <button onclick="gifts()">${CONFIG.letterButton}</button>
  `);
}

function gifts() {
  const total = CONFIG.gifts.length;
  const rows = CONFIG.gifts.map((g, i) => `
    <div class="gift-card ${seen.has(i) ? "played" : ""}" onclick="gift(${i})">
      <div class="num">${String(i + 1).padStart(2, "0")}</div>
      <div>
        <h3>${g.cardTitle}</h3>
        <p>${g.cardDesc}</p>
      </div>
      ${seen.has(i) ? `<span class="badge">${CONFIG.seenLabel}</span>` : ""}
    </div>`).join("");
  render(`
    ${topLabel()}
    <h1>${CONFIG.giftsTitle}</h1>
    <div class="script">${CONFIG.giftsSubtitle}</div>
    <div class="side">LADO B</div>
    <div class="gifts-grid">${rows}</div>
    <div class="count">${seen.size} de ${total} ${CONFIG.giftsCounter}</div>
    ${seen.size === total
      ? `<button onclick="final()">${CONFIG.finalButtonLabel}</button>`
      : `<button class="secondary" onclick="welcome()">${CONFIG.homeButton}</button>`}
  `);
}

function songPlayer(g) {
  return `
    <div class="player" id="player" data-title="${g.videoTitle || ""}">
      <div class="thumb" onclick="playSong('${g.youtubeId}')"
        style="background-image:url('https://i.ytimg.com/vi/${g.youtubeId}/hqdefault.jpg')">
        <span class="playbtn">▶</span>
      </div>
      <div class="player-info">
        <div class="song">${g.videoTitle || ""}</div>
        ${g.videoArtist ? `<div class="artist">${g.videoArtist}</div>` : ""}
        <div class="hint">Tocá la miniatura para reproducir</div>
      </div>
    </div>`;
}

function playSong(id) {
  const player = document.getElementById("player");
  const thumb = player.querySelector(".thumb");
  thumb.outerHTML = `
    <div class="video">
      <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1" title="${player.dataset.title}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>`;
  const hint = player.querySelector(".hint");
  if (hint) hint.remove();
}

function gift(i) {
  seen.add(i);
  const g = CONFIG.gifts[i];
  const video = g.type === "video" && g.youtubeId ? songPlayer(g) : "";
  const quote = g.quote ? `<p class="quote">${g.quote}</p>` : "";
  render(`
    ${topLabel()}
    <div class="side">PISTA ${String(i + 1).padStart(2, "0")}</div>
    <h2>${g.title}</h2>
    ${eq()}
    ${video}
    <div class="paper">${paras(g.paragraphs)}${quote}</div>
    <button class="secondary" onclick="gifts()">${CONFIG.backButton}</button>
  `);
}

function final() {
  const personal = CONFIG.frasePersonal ? `<p class="quote" style="font-style:italic;border-color:var(--accent)">${CONFIG.frasePersonal}</p>` : "";
  render(`
    ${topLabel()}
    ${vinyl()}
    <h1>${CONFIG.finalTitle}</h1>
    <div class="card">${paras(CONFIG.finalLines)}${personal}</div>
    <button class="secondary" onclick="welcome()">${CONFIG.homeButton}</button>
  `);
}

start();
</script>
</body>
</html>
